name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test application
        run: go test ./...

      - name: Build Docker image
        run: docker build --tag person-service:${{ github.sha }} .

      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.RENDER_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for Render service
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.RENDER_DEPLOY_HOOK != '' && vars.RENDER_SERVICE_URL != ''
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "${{ vars.RENDER_SERVICE_URL }}/health"; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Run API Tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && secrets.RENDER_DEPLOY_HOOK != '' && vars.RENDER_SERVICE_URL != ''
        uses: matt-ball/newman-action@master
        with:
          collection: postman/[inst] Lab1.postman_collection.json
          environment: postman/[inst][render] Lab1.postman_environment.json
          delayRequest: 100
          reporters: '[ "cli" ]'

      - name: Autograding
        uses: education/autograding@v1
        continue-on-error: true

